name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore

      - run: dotnet build -c Release --no-restore

      - run: dotnet test -c Release --no-build --report-trx --results-directory ./TestResults --coverage --coverage-output-format cobertura

      - run: dotnet pack -c Release --no-build -o ./artifacts

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: ./TestResults
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: ./artifacts/*.nupkg
